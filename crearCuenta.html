<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FITZONE - Crear Cuenta</title>
    <link rel="stylesheet" href="CSS/miEstilo.css">
      <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="esquina-superior"></div>

    <div class="login-container">
        <div class="login-logo">
            <img src="images/logo.svg" alt="FITZONE Logo">
            <h1>FIT<span>ZONE</span></h1>
        </div>

        <div class="subtitulo-registro">
            <h2>Crear cuenta</h2>
            <p>Crea una cuenta para comenzar</p>
        </div>

        <form class="login-form">
            <div class="input-grupo">
                <span class="icono">👤</span>
                <input type="text" placeholder="Nombre completo" required>
            </div>

            <div class="input-grupo">
                <span class="icono">✉</span>
                <input type="email" placeholder="Correo electrónico" required>
            </div>

            <div class="input-grupo">
                <span class="icono">🔒</span>
                <input type="password" placeholder="Contraseña" required>
            </div>

            <div class="input-grupo">
                <span class="icono">🛡</span>
                <input type="password" placeholder="Confirmar contraseña" required>
            </div>

            <a href="perfil.html" class="btn-neon btn-link">Registrarse</a>

            <div class="recuperar-link centro">
                <a href="iniciarSesion.html">¿Ya tienes una cuenta? Inicia sesión</a>
            </div>
        </form>
    </div>

    
    <div class="esquina-inferior"></div>

</body>
</html>
